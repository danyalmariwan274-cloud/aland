<!DOCTYPE html>
<html lang="ku">
<head>
  <link rel="stylesheet" href="nyaz.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پۆلی 12 زانستی</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
}

header{
    text-align:center;
    padding:50px;
}

h1{
    font-size:50px;
}

.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    padding:20px;
}

.card{
    width:250px;
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,0.1);
    text-align:center;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
}

button{
    padding:10px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>
<body>

<header>
<h1>🎓 پۆلی 12 زانستی</h1>
<p>هەموو وانە و پوختەکان لە یەک شوێن قورت بەسەری دەکەن</p>
  <p>هەندەت نەمایە قوربەسەر</p>
  <h4>بەهیوای سەرکەوتن کاک ئەلەند</h4>
</header>

<div class="container">
<div class="card">
<h2>📐 بیرکاری</h2>
<p>فێربوونی خۆتراندن</p>
</div>

<div class="card">
<h2>⚛️ فیزیا</h2>
<p>یاسای دەستی نان خواردن</p>
</div>

<div class="card">
<h2>🧪 کیمیا</h2>
<p>ئاو تەرە</p>
</div>

<div class="card">
<h2>🧬 زیندەزانی</h2>
<p>ئاژەڵ دەژی و دەمری</p>
</div>
</div>

</body>
</html>
